name: Optimize Velerant Conversion

on:
  push:
    branches:
      - conversion-landing-v2
    paths:
      - .github/workflows/optimize-conversion.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: conversion-landing-v2

      - name: Improve landing conversion
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f"Pattern not found: {label}")
              text = text.replace(old, new, 1)

          if '<link rel="preconnect" href="https://cdn.shopify.com" />' not in text:
              replace_once('  <link rel="preconnect" href="https://fonts.googleapis.com" />','  <link rel="preconnect" href="https://cdn.shopify.com" />\n  <link rel="preconnect" href="https://fonts.googleapis.com" />','preconnect')

          replace_once('<div class="announcement">Acessórios masculinos · design com presença · Velerant</div>','<div class="announcement">Velerant · joalharia masculina · peças desde $132.99</div>','announcement')
          replace_once('<h1>Estilo que impõe <em>presença.</em></h1>','<h1>O detalhe que muda <em>o teu visual.</em></h1>','hero headline')
          replace_once('<p class="hero-sub">Fios e pulseiras desenhados para homens que sabem que os detalhes não completam o visual — definem-no.</p>','<p class="hero-sub">Fios e pulseiras masculinas escolhidos para acrescentar presença sem exagero. Descobre a peça certa e compra diretamente na loja oficial Velerant.</p>','hero sub')
          replace_once('<a class="btn btn-primary" href="#colecao">Explorar coleção <span class="arrow">→</span></a>\n            <a class="btn btn-dark" href="https://velerant.myshopify.com" target="_blank" rel="noopener">Ver loja</a>','<a class="btn btn-primary" href="https://velerant.myshopify.com/collections/all">Comprar coleção <span class="arrow">→</span></a>\n            <a class="btn btn-dark" href="#colecao">Ver mais vendidos</a>','hero actions')
          replace_once('<strong>Feito para se destacar.</strong>\n          Design masculino, materiais marcantes e uma estética construída para transmitir carácter sem dizer uma palavra.','<strong>Escolha simples. Impacto imediato.</strong>\n          Ouro, aço, prata, couro, pedras e pérolas negras — estilos diferentes para encontrares rapidamente o detalhe que combina contigo.','hero note')

          hero_actions = '''          <div class="actions">\n            <a class="btn btn-primary" href="https://velerant.myshopify.com/collections/all">Comprar coleção <span class="arrow">→</span></a>\n            <a class="btn btn-dark" href="#colecao">Ver mais vendidos</a>\n          </div>'''
          hero_actions_new = hero_actions + '''\n          <div class="hero-proof" aria-label="Razões para escolher Velerant">\n            <span><b>01</b> Design masculino</span>\n            <span><b>02</b> Materiais selecionados</span>\n            <span><b>03</b> Compra na loja oficial</span>\n          </div>'''
          replace_once(hero_actions, hero_actions_new, 'hero proof')

          replace_once('<div class="product-meta"><span>Fio</span><span>Ouro 18K</span></div>', '<div class="product-meta"><span>Fio · Ouro 18K</span><span class="price">$299.99</span></div>', 'gold price')
          replace_once('<div class="product-meta"><span>Fio</span><span>Pérolas negras</span></div>', '<div class="product-meta"><span>Fio · Pérolas negras</span><span class="price">$189.99</span></div>', 'pearls price')
          replace_once('<div class="product-meta"><span>Pulseira</span><span>Aço 316L</span></div>', '<div class="product-meta"><span>Pulseira · Aço 316L</span><span class="price">$149.99</span></div>', 'steel price')
          replace_once('<div class="spec"><span>Estilo</span><b>Minimal / masculino</b></div>', '<div class="spec"><span>Estilo</span><b>Minimal / masculino</b></div>\n            <div class="spec"><span>Preço</span><b>$159.99</b></div>', 'silver price')

          text = text.replace(' target="_blank" rel="noopener"', '')

          ticker_end = '''    </div>\n\n    <section id="colecao">'''
          guide = '''    </div>\n\n    <section class="quick-pick" aria-label="Escolha rápida">\n      <div class="container">\n        <div class="quick-pick-head reveal">\n          <span class="eyebrow">Escolha em segundos</span>\n          <h2>Qual é o teu estilo?</h2>\n          <p>Não precisas de percorrer tudo. Escolhe o efeito que procuras e vai direto à peça.</p>\n        </div>\n        <div class="quick-pick-grid">\n          <a class="quick-card reveal" href="https://velerant.myshopify.com/products/pulseira-de-aco-inoxidavel-masculina">\n            <span class="quick-no">01</span><h3>Discreto</h3><p>Linhas limpas, metal e presença controlada.</p><strong>Ver pulseira de aço →</strong>\n          </a>\n          <a class="quick-card reveal" href="https://velerant.myshopify.com/products/fio-de-ouro-18k-masculino">\n            <span class="quick-no">02</span><h3>Premium</h3><p>Ouro e acabamento clássico para elevar o look.</p><strong>Ver fio de ouro →</strong>\n          </a>\n          <a class="quick-card reveal" href="https://velerant.myshopify.com/products/fio-de-perolas-negras-masculino">\n            <span class="quick-no">03</span><h3>Statement</h3><p>Contraste forte para quem quer marcar diferença.</p><strong>Ver pérolas negras →</strong>\n          </a>\n        </div>\n      </div>\n    </section>\n\n    <section id="colecao">'''
          replace_once(ticker_end, guide, 'quick pick')

          final_marker = '    <section class="final-cta">'
          faq = '''    <section class="faq" id="faq">\n      <div class="container faq-grid">\n        <div class="faq-intro reveal">\n          <span class="eyebrow">Antes de escolher</span>\n          <h2>Sem dúvidas.<br><span>Vai direto à peça.</span></h2>\n          <p>As respostas essenciais para escolher sem perder tempo.</p>\n        </div>\n        <div class="faq-list reveal">\n          <details open>\n            <summary>Que tipo de acessórios encontro na Velerant?<span>+</span></summary>\n            <p>Fios e pulseiras masculinas em diferentes estilos e materiais, incluindo aço inoxidável, couro, prata, ouro, pedras naturais e pérolas negras.</p>\n          </details>\n          <details>\n            <summary>Como escolho uma peça para o dia a dia?<span>+</span></summary>\n            <p>Se procuras algo fácil de combinar, começa pelo aço, couro ou prata. Para um visual mais marcante, explora ouro, pedras ou pérolas negras.</p>\n          </details>\n          <details>\n            <summary>Onde é finalizada a compra?<span>+</span></summary>\n            <p>Os botões desta página levam-te diretamente à loja oficial Velerant na Shopify, onde selecionas a peça e finalizas a encomenda.</p>\n          </details>\n          <details>\n            <summary>Os preços apresentados nesta página são em que moeda?<span>+</span></summary>\n            <p>Os preços mostrados aqui estão em USD, a moeda configurada atualmente na loja Velerant.</p>\n          </details>\n        </div>\n      </div>\n    </section>\n\n'''
          replace_once(final_marker, faq + final_marker, 'faq')

          replace_once('<p>Descobre a coleção completa de fios e pulseiras masculinas e encontra a peça que diz tudo antes de dizeres uma palavra.</p>','<p>Já viste os estilos e os materiais. Agora falta só escolher a peça que melhor encaixa no teu visual.</p>','final cta copy')
          replace_once('<a class="btn btn-primary" href="https://velerant.myshopify.com">Comprar agora <span class="arrow">→</span></a>','<a class="btn btn-primary" href="https://velerant.myshopify.com/collections/all">Ver coleção completa <span class="arrow">→</span></a>','final cta button')

          body_end = '''  <script>\n    const navWrap = document.getElementById('navWrap');'''
          sticky = '''  <a class="mobile-buy" href="https://velerant.myshopify.com/collections/all" aria-label="Comprar coleção Velerant">\n    <span><small>VELERANT</small> Ver coleção</span><b>→</b>\n  </a>\n\n  <script>\n    const navWrap = document.getElementById('navWrap');'''
          replace_once(body_end, sticky, 'mobile buy')

          css_marker = '  </style>\n<script>!function(w,d,s,u,n,a,b)'
          css = '''\n    .hero-proof { display:flex; gap:20px; flex-wrap:wrap; margin-top:24px; color:rgba(255,255,255,.62); font-size:10px; letter-spacing:.08em; text-transform:uppercase; }\n    .hero-proof span { display:flex; gap:8px; align-items:center; }\n    .hero-proof b { color:var(--gold-2); font-weight:800; }\n    .price { color:var(--gold-2); font-weight:800; letter-spacing:.05em; }\n\n    .quick-pick { padding:76px 0 30px; background:linear-gradient(180deg,#0a0a08,#070706); }\n    .quick-pick-head { display:grid; grid-template-columns:.7fr 1fr 1fr; gap:28px; align-items:end; margin-bottom:26px; }\n    .quick-pick-head h2 { font-family:"Playfair Display",serif; font-size:clamp(38px,4vw,62px); line-height:1; margin:0; font-weight:600; letter-spacing:-.04em; }\n    .quick-pick-head p { color:var(--muted); line-height:1.7; font-size:13px; margin:0; max-width:430px; }\n    .quick-pick-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }\n    .quick-card { border:1px solid var(--line); background:rgba(255,255,255,.025); padding:28px; min-height:230px; display:flex; flex-direction:column; transition:.25s var(--ease); }\n    .quick-card:hover { transform:translateY(-4px); border-color:rgba(201,165,95,.55); background:rgba(201,165,95,.05); }\n    .quick-no { color:var(--gold); font-size:10px; letter-spacing:.18em; }\n    .quick-card h3 { font-family:"Playfair Display",serif; font-size:36px; margin:22px 0 8px; font-weight:600; }\n    .quick-card p { color:var(--muted); line-height:1.65; font-size:12px; margin:0 0 22px; }\n    .quick-card strong { margin-top:auto; color:var(--gold-2); font-size:10px; text-transform:uppercase; letter-spacing:.12em; }\n\n    .faq { padding:120px 0; border-top:1px solid var(--line); }\n    .faq-grid { display:grid; grid-template-columns:.8fr 1.2fr; gap:80px; }\n    .faq-intro h2 { font-family:"Playfair Display",serif; font-size:clamp(46px,5.5vw,78px); line-height:.98; letter-spacing:-.04em; font-weight:600; margin:16px 0 22px; }\n    .faq-intro h2 span { color:var(--gold-2); }\n    .faq-intro p { color:var(--muted); line-height:1.7; max-width:380px; }\n    .faq-list details { border-top:1px solid var(--line); padding:0; }\n    .faq-list details:last-child { border-bottom:1px solid var(--line); }\n    .faq-list summary { list-style:none; cursor:pointer; padding:24px 0; display:flex; justify-content:space-between; gap:20px; font-size:14px; font-weight:600; }\n    .faq-list summary::-webkit-details-marker { display:none; }\n    .faq-list summary span { color:var(--gold-2); font-size:20px; transition:transform .2s ease; }\n    .faq-list details[open] summary span { transform:rotate(45deg); }\n    .faq-list details p { margin:0 50px 24px 0; color:var(--muted); font-size:13px; line-height:1.75; }\n\n    .mobile-buy { display:none; }\n\n    @media (max-width: 980px) {\n      .quick-pick-head { grid-template-columns:1fr; align-items:start; }\n      .quick-pick-grid { grid-template-columns:1fr; }\n      .quick-card { min-height:190px; }\n      .faq-grid { grid-template-columns:1fr; gap:38px; }\n    }\n\n    @media (max-width: 680px) {\n      body { padding-bottom:72px; }\n      .hero-proof { display:grid; grid-template-columns:1fr; gap:9px; margin-top:20px; }\n      .quick-pick { padding-top:58px; }\n      .quick-card { padding:23px; }\n      .faq { padding:78px 0; }\n      .faq-list summary { font-size:13px; }\n      .mobile-buy { position:fixed; z-index:90; left:10px; right:10px; bottom:10px; min-height:58px; background:var(--cream); color:#111; display:flex; align-items:center; justify-content:space-between; padding:0 19px; box-shadow:0 18px 55px rgba(0,0,0,.42); border:1px solid rgba(0,0,0,.08); }\n      .mobile-buy span { font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.1em; }\n      .mobile-buy small { display:block; font-size:8px; letter-spacing:.2em; opacity:.55; margin-bottom:2px; }\n      .mobile-buy b { font-size:22px; }\n    }\n'''
          replace_once(css_marker, css + '\n  </style>\n<script>!function(w,d,s,u,n,a,b)', 'conversion css')

          path.write_text(text, encoding="utf-8")

      - name: Sanity checks
        shell: python
        run: |
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = ['biz_TLe64QQAtuEpCe','class="quick-pick"','class="faq"','class="mobile-buy"','$299.99','$189.99','$149.99']
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit('Missing required markers: ' + ', '.join(missing))
          if text.count('biz_TLe64QQAtuEpCe') != 1:
              raise SystemExit('Whop pixel scope duplicated or missing')
          if '</head>' not in text or '</body>' not in text:
              raise SystemExit('HTML closing tags missing')

      - name: Commit landing optimization
        run: |
          if git diff --quiet -- index.html; then
            echo "No landing changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          git commit -m "Optimize landing page for conversion"
          git push origin HEAD:conversion-landing-v2
